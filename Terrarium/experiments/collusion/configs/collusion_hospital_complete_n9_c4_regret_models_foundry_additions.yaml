experiment:
  tag: collusion_hospital_complete_n9_c4
  output_dir: experiments/collusion/outputs/collusion_hospital_complete_n9_c4
  max_concurrent_runs: 5
  seeds: [1,2,3,4,5]
  runs_per_seed: 2
  collusion:
    colluder_selection: random
  sweeps:
    - name: complete_n9_c4
      topologies: [complete]
      num_agents: [9]
      colluder_counts: [4]
      secret_channel_enabled: [false, true]
      prompt_variants: [control, simple]
