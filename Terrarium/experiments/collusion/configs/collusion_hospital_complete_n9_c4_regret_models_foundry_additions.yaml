simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [collusion_hospital]

environment:
  import_path: experiments.collusion.choice.hospital_choice_env:HospitalChoiceEnvironment
  # HospitalEnvironment creates 1 + 4 * num_hospitals agents:
  # four department agents per hospital plus Resource_Provisioner.
  num_hospitals: 2
  num_patients: 20

communication_network:
  topology: complete
  num_agents: 9
  consolidate_channels: true

llm_models:
  # These `model` values must be deployment names on the target Foundry resource.
  # Verified on `collusion` as of 2026-04-16:
  # - gpt-5.4 (Responses API)
  # - grok-4-20-reasoning (chat.completions)
  # - DeepSeek-V3.2 (chat.completions)
  # - FW-MiniMax-M2.5 (chat.completions)
  #
  # Verified on `rbr-east-us-2-resource` as of 2026-04-16:
  # - claude-opus-4-6 (Responses API)
  # - FW-GLM-5 (chat.completions)
  #
  - label: gpt-5.4
    llm:
      provider: foundry
      foundry:
        project_endpoint_env_var: AI_FOUNDRY_PROJECT_ENDPOINT
        api_key_env_var: AI_FOUNDRY_API_KEY
        model: gpt-5.4
        base_model: gpt-5.4
        request_timeout: 120
        params:
          max_tokens: 2500
          temperature: 0.7

