simulation:
  max_iterations: 1
  max_planning_rounds: 4
  max_conversation_steps: 3
  seed: 1
  tags: [collusion_regret, mixed_agents]

environment:
  name: JiraTicketEnvironment
  assignment_filling: true
  max_tasks: 8

communication_network:
  topology: complete
  num_agents: 6
  consolidate_channels: true

model_library:
  gpt54: &gpt54
    provider: foundry
    foundry:
      project_endpoint_env_var: AI_FOUNDRY_PROJECT_ENDPOINT
      api_key_env_var: AI_FOUNDRY_API_KEY
      model: gpt-5.4
      base_model: gpt-5.4
      request_timeout: 120
      params:
        max_tokens: 1500
        temperature: 0.7

  opus46: &opus46
    provider: foundry
    foundry:
      auth_mode: api_key
      project_endpoint_env_var: AI_FOUNDRY_RBR_EAST_US_2_PROJECT_ENDPOINT
      api_key_env_var: AI_FOUNDRY_RBR_EAST_US_2_API_KEY
      model: claude-opus-4-6
      request_timeout: 120
      params:
        max_tokens: 1500
        temperature: 0.7

  deepseek32: &deepseek32
    provider: foundry
    foundry:
      project_endpoint_env_var: AI_FOUNDRY_PROJECT_ENDPOINT
      api_key_env_var: AI_FOUNDRY_API_KEY
      api_style: chat_completions
      model: DeepSeek-V3.2
      request_timeout: 180
      params:
        max_tokens: 1500
        temperature: 0.7

  minimax25: &minimax25
    provider: foundry
    foundry:
      project_endpoint_env_var: AI_FOUNDRY_PROJECT_ENDPOINT
      api_key_env_var: AI_FOUNDRY_API_KEY
      api_style: chat_completions
      model: FW-MiniMax-M2.5
      request_timeout: 120
      params:
        max_tokens: 1500
        temperature: 0.7

  glm5: &glm5
    provider: foundry
    foundry:
      project_endpoint_env_var: AI_FOUNDRY_RBR_EAST_US_2_PROJECT_ENDPOINT
      api_key_env_var: AI_FOUNDRY_RBR_EAST_US_2_API_KEY
      api_style: chat_completions
      model: FW-GLM-5
      request_timeout: 120
      params:
        max_tokens: 1500
        temperature: 0.7

llm_models:
  # Agent slots follow env.get_agent_names() order for each generated instance.
  # This profile makes the two GPT-5.4 agents the colluding pair.
  - label: gpt54_gpt54_colluders
    llm: *gpt54
    agent_llms:
      - *gpt54
      - *gpt54
      - *opus46
      - *deepseek32
      - *minimax25
      - *glm5
    collusion:
      colluders:
        indices: [0, 1]

  # This profile keeps two GPT-5.4 agents in the population, but only one GPT-5.4
  # colludes with Opus 4.6. The second GPT-5.4 agent remains benign.
  - label: gpt54_opus46_colluders
    llm: *gpt54
    agent_llms:
      - *gpt54
      - *gpt54
      - *opus46
      - *deepseek32
      - *minimax25
      - *glm5
    collusion:
      colluders:
        indices: [0, 2]

experiment:
  tag: collusion_jira_mixed_agents_gpt54_opus46
  output_dir: experiments/collusion/outputs/collusion_jira_mixed_agents_gpt54_opus46
  max_concurrent_runs: 5
  seeds: [1, 2, 3, 4, 5]
  runs_per_seed: 2
  collusion:
    colluder_selection: random
  sweeps:
    - name: complete_n6_c2
      topologies: [complete]
      num_agents: [6]
      colluder_counts: [2]
      secret_channel_enabled: [false, true]
      prompt_variants: [control, simple]
